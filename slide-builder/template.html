<!doctype html>
<html><head>
<meta charset="utf-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:1440px;height:810px;background:#f1f1f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;color:#202124;
  }
  body{position:relative;overflow:hidden}

  /* Top label */
  .label{
    position:absolute;left:60px;top:42px;
    display:flex;align-items:center;gap:14px;
    font-size:13px;letter-spacing:.22em;color:#606770;font-weight:600;
    text-transform:uppercase;
  }
  .label .ag{font-weight:600}
  .label .num{color:#1a1aff;font-weight:700;letter-spacing:.16em}
  .label .sep{color:#c0c4ce;letter-spacing:0;font-weight:400}
  .label .title{color:#0c0d10;font-weight:700;letter-spacing:.04em;font-size:14px;text-transform:none}

  /* === DESKTOP === */
  .desktop{
    position:absolute;left:120px;top:90px;width:1200px;height:660px;
    background:#fff;border-radius:14px;
    box-shadow: 0 18px 50px rgba(15,18,30,.10), 0 4px 14px rgba(15,18,30,.06);
    overflow:hidden;
  }
  .browser-bar{
    height:46px;background:#fff;border-bottom:1px solid #ececef;
    display:flex;align-items:center;padding:0 18px;gap:8px;
  }
  .dot{width:12px;height:12px;border-radius:50%}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .url-pill{
    flex:1;height:26px;background:#f1f3f4;border-radius:13px;
    display:flex;align-items:center;padding:0 12px;gap:8px;
    font-size:12px;color:#3c4043;margin-left:14px;
  }
  .lock-icon{width:11px;height:11px;flex:none}
  .url-pill .more{margin-left:auto;color:#5f6368;font-weight:700;letter-spacing:1px;font-size:14px}

  .serp{padding:34px 56px 30px}

  .serp-top{display:flex;align-items:center;gap:36px;margin-bottom:22px}
  .glogo{font-family:"Product Sans","Helvetica Neue",Arial,sans-serif;font-size:38px;font-weight:400;letter-spacing:-1px;line-height:1;display:flex;align-items:baseline}
  .glogo span{display:inline-block}
  .glogo .b{color:#4285f4}.glogo .r{color:#ea4335}.glogo .y{color:#fbbc04}.glogo .b2{color:#4285f4}.glogo .g{color:#34a853}.glogo .r2{color:#ea4335}

  .search-pill{
    flex:1;height:46px;border:1px solid #dfe1e5;border-radius:24px;
    display:flex;align-items:center;padding:0 18px;gap:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
    color:#202124;font-size:16px;
  }
  .search-pill .si{width:18px;height:18px;color:#9aa0a6;flex:none}
  .search-pill .right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .gicon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
  .gicon.green{background:#34a853}
  .gicon.blue{background:#1a73e8}

  .tabs{display:flex;align-items:center;gap:32px;border-bottom:1px solid #ebecf0;margin-bottom:0;padding-bottom:0}
  .tab{font-size:14px;color:#5f6368;padding:0 0 14px;position:relative;line-height:1}
  .tab.active{color:#1a73e8;font-weight:500}
  .tab.active::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-1px;height:3px;background:#1a73e8;border-radius:3px 3px 0 0}
  .tabs .tools{margin-left:auto;color:#5f6368;font-size:14px}

  .stats{font-size:12.5px;color:#70757a;margin:14px 0 12px}

  .ad{display:block}
  .ad .sponsored{font-size:13.5px;font-weight:700;color:#202124;margin-bottom:8px}
  .ad-row{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .favicon{
    width:26px;height:26px;border-radius:50%;background:#fff;border:1px solid #e5e7eb;
    display:grid;place-items:center;font-weight:800;color:#1a1aff;font-size:13px;
  }
  .ad-meta{display:flex;align-items:center;gap:8px}
  .ad-brand{font-size:13.5px;color:#202124;font-weight:500}
  .ad-host{font-size:12.5px;color:#5f6368}
  .ad-kebab{margin-left:6px;color:#5f6368;letter-spacing:1px;font-size:14px;font-weight:700}

  .ad-headline{font-size:20px;line-height:1.3;color:#1a0dab;margin:6px 0 8px;font-weight:400}
  .ad-desc{font-size:14px;line-height:1.55;color:#4d5156;max-width:760px}
  .ad-desc .em{font-weight:600;color:#202124}

  .sitelinks{display:grid;grid-template-columns:1fr 1fr;column-gap:60px;row-gap:18px;margin-top:18px;max-width:920px}
  .sl-title{font-size:14px;color:#1a0dab;font-weight:500;margin-bottom:4px;line-height:1.25}
  .sl-desc{font-size:12.5px;line-height:1.5;color:#5f6368;max-width:380px}

  .organic{margin-top:26px}
  .organic .meta{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .organic .name{font-size:13.5px;color:#202124;font-weight:500}
  .organic .host{font-size:12.5px;color:#5f6368}
  .organic .heading{font-size:20px;color:#681da8;font-weight:400;margin-bottom:6px;line-height:1.3}
  .organic .snippet{font-size:14px;line-height:1.55;color:#4d5156;max-width:780px}

  /* Bottom-corner ad-group label */
  .corner{
    position:absolute;left:60px;bottom:38px;
    font-size:12.5px;color:#7a818d;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  }
  .corner .top{color:#a0a4ad;font-size:11px;margin-bottom:4px;letter-spacing:.22em}
  .corner .num{color:#1a1aff;font-weight:700;font-size:13px;letter-spacing:.18em}

  /* === MOBILE === */
  .mobile-stage{position:absolute;inset:0}
  .phone{
    position:absolute;left:330px;top:88px;
    width:380px;height:660px;
    background:#0b0b0e;border-radius:46px;
    padding:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,.18);
  }
  .phone-screen{
    width:100%;height:100%;background:#fff;border-radius:34px;
    overflow:hidden;position:relative;
  }
  .status-bar{
    height:38px;display:flex;align-items:center;justify-content:space-between;
    padding: 0 26px;font-size:13px;font-weight:600;color:#0b0b0e;
    position:relative;
  }
  .notch{
    position:absolute;left:50%;top:8px;transform:translateX(-50%);
    width:96px;height:24px;background:#0b0b0e;border-radius:14px;
  }
  .status-bar .right{display:flex;align-items:center;gap:5px;font-size:11px}

  .m-search-bar{display:flex;align-items:center;gap:8px;padding:6px 14px 12px}
  .m-glogo{font-family:"Product Sans","Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1;display:flex;align-items:baseline}
  .m-pill{
    flex:1;height:34px;border-radius:18px;border:1px solid #dfe1e5;
    display:flex;align-items:center;padding:0 12px;gap:8px;
    font-size:13px;color:#202124;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .m-pill .blue-dot{width:14px;height:14px;border-radius:50%;background:#1a73e8;margin-left:auto}

  .m-tabs{display:flex;align-items:center;gap:14px;border-bottom:1px solid #ebecf0;padding:0 14px 8px}
  .m-tabs .tab{font-size:11.5px;color:#5f6368;padding-bottom:6px;position:relative;line-height:1}
  .m-tabs .tab.active{color:#1a73e8}
  .m-tabs .tab.active::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-1px;height:2px;background:#1a73e8;border-radius:2px}

  .m-result{padding:12px 16px 8px}
  .m-sponsored{font-size:12px;font-weight:700;margin-bottom:8px}
  .m-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .m-favicon{width:22px;height:22px;border-radius:50%;border:1px solid #e5e7eb;display:grid;place-items:center;color:#1a1aff;font-size:11px;font-weight:800;background:#fff}
  .m-brand-col{display:flex;flex-direction:column;line-height:1.2}
  .m-brand{font-size:11.5px;color:#202124;font-weight:500}
  .m-host{font-size:11px;color:#5f6368}
  .m-headline{font-size:14px;color:#1a0dab;line-height:1.3;margin:6px 0 6px;font-weight:400}
  .m-desc{font-size:12px;line-height:1.45;color:#4d5156}
  .m-desc .em{font-weight:600;color:#202124}

  .m-sitelinks{padding:6px 16px 12px}
  .m-sitelink{font-size:12.5px;color:#1a0dab;padding:9px 0;border-bottom:1px solid #ececf0}
  .m-sitelink:last-child{border-bottom:none}

  /* Right meta panel */
  .meta-panel{position:absolute;left:780px;top:160px;width:560px}
  .meta-panel .ag{font-size:13px;color:#7a818d;letter-spacing:.18em;font-weight:600;text-transform:uppercase;margin-bottom:18px}
  .meta-panel .ag .num{color:#1a1aff}
  .meta-panel h1{font-size:62px;line-height:1.02;font-weight:800;color:#0c0d10;letter-spacing:-.01em;margin-bottom:22px}
  .meta-rule{height:1px;background:#dadce0;margin: 6px 0 14px;width:340px}
  .meta-row{display:flex;align-items:flex-start;gap:24px;padding:9px 0;font-size:14.5px;line-height:1.5}
  .meta-row .k{width:90px;color:#7a818d;letter-spacing:.16em;font-size:11.5px;text-transform:uppercase;font-weight:600;padding-top:3px;flex:none}
  .meta-row .v{font-family: "SF Mono", Menlo, Consolas, monospace;font-size:14.5px;color:#0c0d10}
  .meta-row.query .v{color:#1a1aff}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // GLOGO svg-ish
  function glogo(big){
    return `<div class="${big?'glogo':'m-glogo'}">`+
      `<span class="b">G</span><span class="r">o</span><span class="y">o</span>`+
      `<span class="b2">g</span><span class="g">l</span><span class="r2">e</span></div>`;
  }
  function lockSvg(){
    return `<svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 1 1 8 0v3"/></svg>`;
  }
  function searchSvg(){
    return `<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
  }

  function renderDesktop(d){
    const tabs = d.tabs.map((t,i)=>`<div class="tab ${i===0?'active':''}">${t}</div>`).join('');
    const sl = d.sitelinks.map(s=>`
      <div>
        <div class="sl-title">${s.t}</div>
        <div class="sl-desc">${s.d}</div>
      </div>`).join('');
    const desc = d.desc.replace(/Free 20-min consult\./g,'<span class="em">Free 20-min consult.</span>');
    return `
      <div class="label">
        <span class="ag">AD GROUP <span class="num">${d.n}</span></span>
        <span class="sep">·</span>
        <span class="title">${d.name} · Desktop</span>
      </div>
      <div class="desktop">
        <div class="browser-bar">
          <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
          <div class="url-pill">${lockSvg()}<span>google.com/search?q=${d.query.replace(/ /g,'+')}</span><span class="more">⋮</span></div>
        </div>
        <div class="serp">
          <div class="serp-top">
            ${glogo(true)}
            <div class="search-pill">${searchSvg()}<span>${d.query}</span>
              <div class="right"><div class="gicon green">●</div><div class="gicon blue">●</div></div>
            </div>
          </div>
          <div class="tabs">${tabs}<div class="tools">Tools</div></div>
          <div class="stats">About ${d.counts.results} results (${d.counts.secs} seconds)</div>
          <div class="ad">
            <div class="sponsored">Sponsored</div>
            <div class="ad-row">
              <div class="favicon">L</div>
              <div class="ad-meta">
                <span class="ad-brand">Longevity Life Academy</span>
                <span class="ad-host">· ${d.domainShown}</span>
                <span class="ad-kebab">⋮</span>
              </div>
            </div>
            <div class="ad-headline">${d.headline}</div>
            <div class="ad-desc">${desc}</div>
            <div class="sitelinks">${sl}</div>
          </div>
          <div class="organic">
            <div class="meta">
              <span class="name">${d.competitor.name}</span>
              <span class="host">· ${d.competitor.host}</span>
            </div>
            <div class="heading">${d.competitor.heading}</div>
            <div class="snippet">${d.competitor.snippet}</div>
          </div>
        </div>
      </div>
      `;
  }

  function statusBarSvg(){
    // signal bars + wifi + battery, mimicking iOS status bar at the right side
    return `<div class="right">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="#0b0b0e" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4.5" y="5" width="3" height="6" rx=".6"/><rect x="9" y="3" width="3" height="8" rx=".6"/><rect x="13.5" y="0.5" width="3" height="10.5" rx=".6"/></svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#0b0b0e" stroke-width="1.2" stroke-linecap="round" xmlns="http://www.w3.org/2000/svg" style="margin-left:5px"><path d="M1.4 4.2c1.7-1.5 4-2.4 6.1-2.4S12 2.7 13.6 4.2"/><path d="M3.5 6.2c1.2-1 2.6-1.6 4-1.6s2.8.6 4 1.6"/><path d="M5.7 8.2c.6-.5 1.2-.8 1.8-.8s1.2.3 1.8.8"/><circle cx="7.5" cy="9.7" r="0.7" fill="#0b0b0e" stroke="none"/></svg>
      <svg width="26" height="12" viewBox="0 0 26 12" xmlns="http://www.w3.org/2000/svg" style="margin-left:5px"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5" fill="none" stroke="#0b0b0e" stroke-opacity=".5"/><rect x="23" y="4" width="1.6" height="4" rx=".5" fill="#0b0b0e" fill-opacity=".5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="#0b0b0e"/></svg>
    </div>`;
  }

  function renderMobile(d){
    const tabs = (d.tabs.slice(0,5)).map((t,i)=>`<div class="tab ${i===0?'active':''}">${t}</div>`).join('');
    const sl = d.sitelinks.slice(0,3).map(s=>`<div class="m-sitelink">${s.t} ›</div>`).join('');
    return `
      <div class="label">
        <span class="ag">AD GROUP <span class="num">${d.n}</span></span>
        <span class="sep">·</span>
        <span class="title">${d.name} · Mobile</span>
      </div>
      <div class="mobile-stage">
        <div class="phone">
          <div class="phone-screen">
            <div class="status-bar">
              <div class="notch"></div>
              <span>9:41</span>
              ${statusBarSvg()}
            </div>
            <div class="m-search-bar">
              ${glogo(false)}
              <div class="m-pill">
                <span>${d.query}</span>
                <span class="blue-dot"></span>
              </div>
            </div>
            <div class="m-tabs">${tabs}</div>
            <div class="m-result">
              <div class="m-sponsored">Sponsored</div>
              <div class="m-row">
                <div class="m-favicon">L</div>
                <div class="m-brand-col">
                  <div class="m-brand">Longevity Life Academy</div>
                  <div class="m-host">${d.domainShown.replace('https://','').replace('www.','')}</div>
                </div>
              </div>
              <div class="m-headline">${d.headline}</div>
              <div class="m-desc">${d.descShort}</div>
            </div>
            <div class="m-sitelinks">${sl}</div>
          </div>
        </div>
        <div class="meta-panel">
          <div class="ag">AD GROUP <span class="num">${d.n}</span></div>
          <h1>${d.nameLines[0]}<br/>${d.nameLines[1]}</h1>
          <div class="meta-rule"></div>
          <div class="meta-row query"><div class="k">Query</div><div class="v">${d.query}</div></div>
          <div class="meta-row"><div class="k">Match</div><div class="v">${d.match}</div></div>
          <div class="meta-row"><div class="k">Device</div><div class="v">Mobile · iOS</div></div>
          <div class="meta-row"><div class="k">Position</div><div class="v">Top, slot 1</div></div>
        </div>
      </div>`;
  }

  function render(){
    const d = window.__SLIDE__;
    const root = document.getElementById('root');
    root.innerHTML = (d.mode === 'desktop') ? renderDesktop(d) : renderMobile(d);
  }
  // Wait for explicit kick:
  window.__renderSlide = render;
</script>
</body></html>
